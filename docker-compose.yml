services:
  change-intelligence:
    build: .
    ports:
      - "8780:8780"
    environment:
      AUTH_MODE: token
      AUTH_TOKENS_JSON: ${AUTH_TOKENS_JSON:?Set AUTH_TOKENS_JSON to a secret token map}
      RUNTIME_DATA_DIR: /app/runtime
      BACKUP_DIR: /app/backups
      RESEARCH_ROOT: /app/research
      PACKET_PATH: /app/runtime/ai-work-control.packet.json
    volumes:
      - change-intelligence-runtime:/app/runtime
      - change-intelligence-backups:/app/backups
      - ${RESEARCH_ROOT:?Set RESEARCH_ROOT}:/app/research:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8780/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  change-intelligence-scheduler:
    build: .
    command: ["node", "scripts/scheduler.mjs"]
    environment:
      RUNTIME_DATA_DIR: /app/runtime
      RESEARCH_ROOT: /app/research
      PACKET_PATH: /app/runtime/ai-work-control.packet.json
      REFRESH_INTERVAL_MS: ${REFRESH_INTERVAL_MS:-21600000}
      OPERATOR_NOTIFICATION_DELIVERY_MODE: ${OPERATOR_NOTIFICATION_DELIVERY_MODE:-disabled}
      OPERATOR_NOTIFICATION_WEBHOOK_URL: ${OPERATOR_NOTIFICATION_WEBHOOK_URL:-}
      OPERATOR_NOTIFICATION_MAX_ATTEMPTS: ${OPERATOR_NOTIFICATION_MAX_ATTEMPTS:-3}
      OPERATOR_NOTIFICATION_RETRY_DELAY_MS: ${OPERATOR_NOTIFICATION_RETRY_DELAY_MS:-60000}
      OPERATOR_NOTIFICATION_TIMEOUT_MS: ${OPERATOR_NOTIFICATION_TIMEOUT_MS:-5000}
    volumes:
      - change-intelligence-runtime:/app/runtime
      - ${RESEARCH_ROOT:?Set RESEARCH_ROOT}:/app/research:ro
    restart: unless-stopped

volumes:
  change-intelligence-runtime:
  change-intelligence-backups:
