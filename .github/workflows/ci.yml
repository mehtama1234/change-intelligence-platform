name: Change Intelligence CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run clean-checkout contract tests
        run: npm run ci:core

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --tag change-intelligence-platform:${{ github.sha }} .
