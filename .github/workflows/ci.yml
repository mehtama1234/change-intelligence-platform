name: Change Intelligence CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_ROOT: ${{ github.workspace }}/ci-research
      RESEARCH_REPOSITORIES_TOKEN: ${{ secrets.RESEARCH_REPOSITORIES_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare checked-in research contract snapshot
        run: CI_RESEARCH_ROOT="$RESEARCH_ROOT" node scripts/prepare-ci-research-snapshot.mjs
      - name: Validate live research repositories when credentials are configured
        if: ${{ env.RESEARCH_REPOSITORIES_TOKEN != '' }}
        run: |
          live_root="$RUNNER_TEMP/live-research"
          mkdir -p "$live_root"
          for repository in annual-report-research cultural-geopolitical-theme-mining ibis-industries; do
            git clone --depth 1 --branch main "https://github.com/mehtama1234/${repository}.git" "$live_root/$repository"
          done
          for repository in company-atlas-lab trend-hunting inc5000-analysis; do
            git -c "http.extraheader=AUTHORIZATION: bearer ${RESEARCH_REPOSITORIES_TOKEN}" clone --depth 1 --branch main "https://github.com/mehtama1234/${repository}.git" "$live_root/$repository"
          done
          RESEARCH_ROOT="$live_root" REQUIRE_SOURCE_FILES=1 npm run validate:adapters
          RESEARCH_ROOT="$live_root" npm run validate:company-report-windows
      - name: Note that live research credentials are not configured
        if: ${{ env.RESEARCH_REPOSITORIES_TOKEN == '' }}
        run: echo "::notice::Live research repository validation skipped; configure RESEARCH_REPOSITORIES_TOKEN to enable it. Core tests use the checked-in contract snapshot."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Materialize runtime from the research contract snapshot
        run: npm run refresh
        env:
          REFRESH_SKIP_SEC: "1"
          REFRESH_RETRIES: "0"
      - name: Initialize API runtime ledgers
        run: npm run initialize:runtime-ledgers
      - name: Run clean-checkout contract tests
        run: npm run ci:core
        env:
          RUNTIME_DATA_DIR: ${{ github.workspace }}/data/processed/runs/ai-work-control
          INSIGHT_PACKET_PATH: ${{ github.workspace }}/data/processed/runs/ai-work-control/ai-work-control.packet.json
          CI_CONTRACT_SNAPSHOT: "1"
      - name: Run browser acceptance
        run: npm run test:frontend-browser

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    env:
      RESEARCH_ROOT: /tmp/change-intelligence-research
      AUTH_TOKENS_JSON: '{"ci-token":"ci-member"}'
      OPERATOR_ACTORS_JSON: '["ci-operator"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create read-only research mount
        run: mkdir -p "$RESEARCH_ROOT"
      - name: Validate Compose interpolation
        run: docker compose config
      - name: Build production image
        run: docker compose build
      - name: Start API container
        run: docker compose up -d change-intelligence
      - name: Check API liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8780/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs change-intelligence
          exit 1
      - name: Check container health state
        run: |
          container_id="$(docker compose ps -q change-intelligence)"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v
