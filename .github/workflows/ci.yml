name: Change Intelligence CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEARCH_ROOT: ${{ github.workspace }}/research
      RESEARCH_REPOSITORIES_TOKEN: ${{ secrets.RESEARCH_REPOSITORIES_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Materialize research repositories
        run: |
          mkdir -p "$RESEARCH_ROOT"
          for repository in annual-report-research trend-hunting cultural-geopolitical-theme-mining ibis-industries inc5000-analysis; do
            git clone --depth 1 --branch main "https://github.com/mehtama1234/${repository}.git" "$RESEARCH_ROOT/$repository"
          done
          if [ -z "${RESEARCH_REPOSITORIES_TOKEN:-}" ]; then
            echo "::error::Set the RESEARCH_REPOSITORIES_TOKEN repository secret so CI can read the private company-atlas-lab repository."
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer ${RESEARCH_REPOSITORIES_TOKEN}" clone --depth 1 --branch main "https://github.com/mehtama1234/company-atlas-lab.git" "$RESEARCH_ROOT/company-atlas-lab"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run clean-checkout contract tests
        run: npm run ci:core
      - name: Run browser acceptance
        run: npm run test:frontend-browser

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests
    env:
      RESEARCH_ROOT: /tmp/change-intelligence-research
      AUTH_TOKENS_JSON: '{"ci-token":"ci-member"}'
      OPERATOR_ACTORS_JSON: '["ci-operator"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create read-only research mount
        run: mkdir -p "$RESEARCH_ROOT"
      - name: Validate Compose interpolation
        run: docker compose config
      - name: Build production image
        run: docker compose build
      - name: Start API container
        run: docker compose up -d change-intelligence
      - name: Check API liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8780/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs change-intelligence
          exit 1
      - name: Check container health state
        run: |
          container_id="$(docker compose ps -q change-intelligence)"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v
